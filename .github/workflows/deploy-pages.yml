# ShiftFlow PWA - GitHub Pages deploy.
#
# In the repository settings, set Pages "Source" to "GitHub Actions".

name: Deploy PWA to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShiftFlow-PWA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ShiftFlow-PWA/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SHIFTFLOW_BASE: /ShiftFlow/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ShiftFlow-PWA/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
