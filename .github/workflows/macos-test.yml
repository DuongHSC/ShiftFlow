name: macOS Build & Test

# TASK-GITHUB-ACTIONS-001
# Builds and tests ShiftFlow on a real GitHub-hosted macOS runner, because the
# development host is Windows (no Swift/Xcode). This workflow does NOT change any
# product code; it only compiles and runs the existing test suites.
#
# Scope guarantees (see task rules):
# - No archive / distribution signing (unit tests run on Simulator, unsigned).
# - No tests deleted, skipped, or weakened.
# - CloudKit/notification RUNTIME verification is not attempted here; offline
#   unit/integration tests still run.

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    # Prefer macos-15 (Xcode 16 / iOS 18 SDK). If unavailable on the account,
    # switch to macos-14 and document the reason in the run logs.
    runs-on: macos-15

    env:
      PROJECT: ShiftFlow/ShiftFlow.xcodeproj
      SCHEME: ShiftFlow
      PACKAGE_DIR: ShiftFlow/ShiftFlowDomain
      RESULT_BUNDLE: TestResults.xcresult

    steps:
      # ----------------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. Select Xcode
      #    Pick the latest stable Xcode present on the runner (do not hardcode
      #    a version that may not exist on the chosen image).
      # ----------------------------------------------------------------------
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ----------------------------------------------------------------------
      # 3. Environment discovery (never hardcoded)
      # ----------------------------------------------------------------------
      - name: Inspect environment
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          swift --version
          echo "----- Available simulator devices -----"
          xcrun simctl list devices available

      # ----------------------------------------------------------------------
      # 4. Swift Package validation (ShiftFlowDomain)
      #    Resolve + build the pure-domain package standalone. The four
      #    app-dependent test files are excluded from the SPM test target
      #    (TASK-XCODE-FIX-001), so `swift build` compiles the domain cleanly.
      # ----------------------------------------------------------------------
      - name: Resolve & build ShiftFlowDomain package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euxo pipefail
          swift package resolve
          swift build

      # ----------------------------------------------------------------------
      # 5. List the Xcode project (validates project.pbxproj loads)
      # ----------------------------------------------------------------------
      - name: List Xcode project
        run: |
          set -euxo pipefail
          xcodebuild -list -project "$PROJECT"

      # ----------------------------------------------------------------------
      # 6. Pick an available iOS Simulator destination dynamically
      # ----------------------------------------------------------------------
      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          # First available iPhone simulator UDID (shell-only; no embedded newlines).
          # `simctl list devices available` prints lines like:
          #   iPhone 15 (UDID) (Shutdown)
          # Extract the first UDID from the first iPhone line.
          UDID=$(xcrun simctl list devices available | grep -Eo 'iPhone[^(]*\(([0-9A-F-]+)\)' | grep -Eo '[0-9A-F-]{36}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      # ----------------------------------------------------------------------
      # 7. Build the app (Debug, Simulator, no signing required)
      #    Building the ShiftFlow scheme also builds the embedded
      #    ShiftFlowWidgetExtension (it is a dependency of the app target).
      # ----------------------------------------------------------------------
      - name: Build ShiftFlow (app + widget)
        run: |
          set -euxo pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # ----------------------------------------------------------------------
      # 7b. Diagnostic: surface the FIRST xcodebuild errors in the Actions log.
      #     Runs ONLY when a previous step failed (build failure). It never
      #     fails on its own (no matches is fine) and never hides the original
      #     build failure — the job stays FAILED. No build commands changed.
      # ----------------------------------------------------------------------
      - name: Show first build errors (on failure)
        if: ${{ failure() }}
        run: |
          if [ -f build.log ]; then
            echo "===== FIRST XCODEBUILD ERRORS ====="
            grep -n -E '(^|[[:space:]])error:|BUILD FAILED|CodeSign|Provisioning|No such module|Undefined symbols|CompileSwift' build.log | head -n 30 || true
            echo "===== END FIRST XCODEBUILD ERRORS ====="
          else
            echo "build.log not found"
          fi

      # ----------------------------------------------------------------------
      # 8. Run the full test suite on the Simulator
      #    Uses the already-built products (test-without-building) and writes an
      #    .xcresult bundle for artifact upload.
      # ----------------------------------------------------------------------
      - name: Run tests (ShiftFlowTests)
        run: |
          set -euxo pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      # ----------------------------------------------------------------------
      # 9. Upload .xcresult + logs on failure (no secrets/certs involved)
      # ----------------------------------------------------------------------
      - name: Upload xcresult and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-and-logs
          path: |
            ${{ env.RESULT_BUNDLE }}
            build.log
            test.log
          retention-days: 14
          if-no-files-found: warn
