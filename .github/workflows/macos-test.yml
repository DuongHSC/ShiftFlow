name: macOS Build & Test

# TASK-GITHUB-ACTIONS-001
# Builds and tests ShiftFlow on a real GitHub-hosted macOS runner, because the
# development host is Windows (no Swift/Xcode). This workflow does NOT change any
# product code; it only compiles and runs the existing test suites.
#
# Scope guarantees (see task rules):
# - No archive / distribution signing (unit tests run on Simulator, unsigned).
# - No tests deleted, skipped, or weakened.
# - CloudKit/notification RUNTIME verification is not attempted here; offline
#   unit/integration tests still run.

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    # Prefer macos-15 (Xcode 16 / iOS 18 SDK). If unavailable on the account,
    # switch to macos-14 and document the reason in the run logs.
    runs-on: macos-15

    env:
      PROJECT: ShiftFlow/ShiftFlow.xcodeproj
      SCHEME: ShiftFlow
      PACKAGE_DIR: ShiftFlow/ShiftFlowDomain
      RESULT_BUNDLE: TestResults.xcresult

    steps:
      # ----------------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. Select Xcode
      #    Pick the latest stable Xcode present on the runner (do not hardcode
      #    a version that may not exist on the chosen image).
      # ----------------------------------------------------------------------
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ----------------------------------------------------------------------
      # 3. Environment discovery (never hardcoded)
      # ----------------------------------------------------------------------
      - name: Inspect environment
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          swift --version
          echo "----- Available simulator devices -----"
          xcrun simctl list devices available

      # ----------------------------------------------------------------------
      # 4. Swift Package validation (ShiftFlowDomain)
      #    Resolve + build the pure-domain package standalone. The four
      #    app-dependent test files are excluded from the SPM test target
      #    (TASK-XCODE-FIX-001), so `swift build` compiles the domain cleanly.
      # ----------------------------------------------------------------------
      - name: Resolve & build ShiftFlowDomain package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euxo pipefail
          swift package resolve
          swift build

      # ----------------------------------------------------------------------
      # 5. List the Xcode project (validates project.pbxproj loads)
      # ----------------------------------------------------------------------
      - name: List Xcode project
        run: |
          set -euxo pipefail
          xcodebuild -list -project "$PROJECT"

      # ----------------------------------------------------------------------
      # 6. Pick an available iOS Simulator destination dynamically
      # ----------------------------------------------------------------------
      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          # First available iPhone simulator UDID (shell-only; no embedded newlines).
          # `simctl list devices available` prints lines like:
          #   iPhone 15 (UDID) (Shutdown)
          # Extract the first UDID from the first iPhone line.
          UDID=$(xcrun simctl list devices available | grep -Eo 'iPhone[^(]*\(([0-9A-F-]+)\)' | grep -Eo '[0-9A-F-]{36}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      # ----------------------------------------------------------------------
      # 7. Build the app (Debug, Simulator, no signing required)
      #    Building the ShiftFlow scheme also builds the embedded
      #    ShiftFlowWidgetExtension (it is a dependency of the app target).
      # ----------------------------------------------------------------------
      - name: Build ShiftFlow (app + widget)
        run: |
          set -euxo pipefail
          # DISABLE_CLOUDKIT compiles out the CloudKit branch in
          # PersistenceConfiguration.makeContainer for this unsigned Simulator
          # build (no iCloud entitlement), so the app uses the local SwiftData
          # store and does not trap in CloudKit at launch. Signed production
          # builds are built WITHOUT this flag and keep full CloudKit sync.
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) DISABLE_CLOUDKIT' \
            | tee build.log

      # ----------------------------------------------------------------------
      # 7b. Diagnostic: surface the actual xcodebuild failure in the Actions log.
      #     Runs ONLY when a previous step failed (build failure). It always
      #     exits successfully and never hides the original build failure —
      #     the job stays FAILED. No build commands changed.
      # ----------------------------------------------------------------------
      - name: Show build failure details (on failure)
        if: ${{ failure() }}
        run: |
          echo "===== BUILD LOG STATUS ====="
          if [ -f build.log ]; then
            wc -c build.log
            wc -l build.log
            echo "===== LAST 200 LINES ====="
            tail -n 200 build.log
            echo "===== ERROR MATCHES ====="
            grep -n -E 'error:|fatal error:|BUILD FAILED|CodeSign|codesign|Provisioning|No such module|Undefined symbols|SwiftCompile|CompileSwift|Ld |PhaseScriptExecution' build.log | tail -n 100 || true
            echo "===== END BUILD FAILURE DETAILS ====="
          else
            echo "build.log NOT FOUND"
            echo "===== END BUILD FAILURE DETAILS ====="
          fi

      # ----------------------------------------------------------------------
      # 8. Run the full test suite on the Simulator
      #    Uses the already-built products (test-without-building) and writes an
      #    .xcresult bundle for artifact upload.
      # ----------------------------------------------------------------------
      - name: Run tests (ShiftFlowTests)
        run: |
          set -euxo pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      # ----------------------------------------------------------------------
      # 9. Upload .xcresult + logs on failure (no secrets/certs involved)
      # ----------------------------------------------------------------------
      - name: Upload xcresult and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-and-logs
          path: |
            ${{ env.RESULT_BUNDLE }}
            build.log
            test.log
          retention-days: 14
          if-no-files-found: warn

  # ==========================================================================
  # TASK-RELEASE-BUILD-002: Produce a LOCAL-ONLY Release .app artifact for the
  # iOS Simulator. Unsigned (CODE_SIGNING_ALLOWED=NO) and DISABLE_CLOUDKIT, so
  # it is Simulator-only and never initializes CloudKit. This job is additive;
  # it does not change the existing build-and-test job or any product code.
  # ==========================================================================
  release-simulator-build:
    name: Release Simulator Build (.app artifact)
    runs-on: macos-15

    env:
      PROJECT: ShiftFlow/ShiftFlow.xcodeproj
      SCHEME: ShiftFlow
      DERIVED: DerivedData-Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -Eo 'iPhone[^(]*\(([0-9A-F-]+)\)' | grep -Eo '[0-9A-F-]{36}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build Release (Simulator, unsigned, local-only)
        run: |
          set -euxo pipefail
          # Release configuration; unsigned; CloudKit compiled out (local-only).
          # Fixed DerivedData path so we can locate ShiftFlow.app deterministically.
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) DISABLE_CLOUDKIT' \
            | tee release-build.log

      - name: Show release build failure (on failure)
        if: ${{ failure() }}
        run: |
          echo "===== RELEASE BUILD FAILURE ====="
          if [ -f release-build.log ]; then
            tail -n 200 release-build.log
            echo "===== ERROR MATCHES ====="
            grep -n -E 'error:|fatal error:|BUILD FAILED|CodeSign|Provisioning|No such module|Undefined symbols|Ld ' release-build.log | tail -n 100 || true
          else
            echo "release-build.log NOT FOUND"
          fi

      - name: Locate, verify, and package ShiftFlow.app
        run: |
          set -euxo pipefail
          APP=$(find "$DERIVED/Build/Products" -type d -name 'ShiftFlow.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "ShiftFlow.app not found under $DERIVED/Build/Products" >&2
            find "$DERIVED/Build/Products" -maxdepth 3 -name '*.app' -o -name '*.appex' || true
            exit 1
          fi
          echo "APP=$APP"

          echo "===== Verify embedded Widget extension ====="
          APPEX="$APP/PlugIns/ShiftFlowWidgetExtension.appex"
          test -d "$APPEX" || { echo "Widget extension missing at $APPEX" >&2; ls -la "$APP/PlugIns" || true; exit 1; }

          echo "===== Verify CFBundleIdentifier ====="
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "CFBundleIdentifier=$BID"
          test "$BID" = "com.shiftflow.app" || { echo "Unexpected bundle id: $BID" >&2; exit 1; }

          echo "===== App version ====="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true

          echo "===== Package artifact ====="
          # Zip the .app preserving its bundle structure.
          ( cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent "ShiftFlow.app" "$GITHUB_WORKSPACE/ShiftFlow-v0.9.5-Simulator.zip" )
          ls -la "$GITHUB_WORKSPACE/ShiftFlow-v0.9.5-Simulator.zip"

      - name: Upload Release Simulator artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShiftFlow-v0.9.5-Simulator
          path: |
            ShiftFlow-v0.9.5-Simulator.zip
            release-build.log
          retention-days: 14
          if-no-files-found: warn
